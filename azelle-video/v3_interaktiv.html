<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Azelle — 3. Interaktiv</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
#logoTop{position:absolute;left:90px;top:260px;transform:scale(.62);transform-origin:50% 0;animation:fadeIn .8s ease .2s both;--sd:1s}
.part{position:absolute;left:0;right:0;top:0;bottom:0}
.q{position:absolute;left:80px;right:80px;text-align:center;font-family:Playfair;font-weight:700;font-size:72px;color:var(--em);line-height:1.15}

/* A: slider sticker */
#A{animation:fadeOut .45s ease 5.0s forwards}
#A .q{top:640px;animation:rise .7s ease .7s both}
#slider{position:absolute;left:130px;top:900px;width:820px;height:300px;padding:70px 60px;animation:pop .7s ease 1.2s both}
#slider .lbl{font-size:36px;font-weight:600;color:#8a6a55;letter-spacing:1px}
#track{position:relative;margin-top:60px;height:26px;border-radius:13px;background:#eadfdc;overflow:visible}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:13px;width:0;background:linear-gradient(90deg,#f4a9bd,#e07895,#c99a3e);
  animation:fillTo 1.3s cubic-bezier(.5,0,.3,1) 2.3s both}
@keyframes fillTo{from{width:0}to{width:100%}}
#knob{position:absolute;top:50%;left:0;font-size:96px;line-height:1;transform:translate(-50%,-50%);
  animation:knobTo 1.3s cubic-bezier(.5,0,.3,1) 2.3s both, knobBig .6s ease 3.6s both}
@keyframes knobTo{from{left:0}to{left:100%}}
@keyframes knobBig{0%{font-size:96px}50%{font-size:150px}100%{font-size:120px}}
#tapA{left:180px;top:1095px;animation:tapDrag 1.9s ease 1.9s both}
@keyframes tapDrag{0%{opacity:0;transform:translate(120px,200px)}20%{opacity:1;transform:none}30%{transform:scale(.8)}85%{opacity:1;transform:translateX(700px) scale(.8)}100%{opacity:0;transform:translateX(700px) scale(1.3)}}
.fly{position:absolute;font-size:80px;opacity:0;animation:flyUp var(--d) ease-out var(--dl) both}
@keyframes flyUp{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1;transform:translate(calc(var(--x)*.2),-80px) scale(1)}100%{opacity:0;transform:translate(var(--x),-700px) scale(.8) rotate(var(--r))}}

/* B: colours */
#B{animation:fadeIn .4s ease 5.3s both}
#Bin{animation:fadeOut .45s ease 9.5s forwards}
#B .q{top:640px;animation:rise .7s ease 5.4s both}
#sw{position:absolute;left:100px;right:100px;top:880px;display:grid;grid-template-columns:1fr 1fr;gap:40px 40px}
.s{display:flex;flex-direction:column;align-items:center;animation:pop .6s cubic-bezier(.2,1.5,.4,1) var(--t) both}
.s i{width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 8px #fff,0 0 0 11px var(--gold-l),0 18px 35px rgba(150,80,90,.25)}
.s b{margin-top:22px;font-family:Playfair;font-size:50px;color:var(--em)}
#cm{position:absolute;top:1490px;left:0;right:0;text-align:center;font-size:48px;font-weight:700;color:var(--em);animation:rise .6s ease 7.6s both}
#cm .emoji{display:inline-block;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(10px)}}

/* C: actions + follow */
#C{animation:fadeIn .4s ease 9.8s both}
#C .q{top:620px;animation:rise .7s ease 9.9s both}
#acts{position:absolute;left:110px;right:110px;top:820px}
.ac{display:flex;align-items:center;gap:40px;height:120px;padding:0 40px;margin-bottom:20px;animation:slideL .6s cubic-bezier(.2,1,.3,1) var(--t) both}
.ac svg{width:76px;height:76px;flex:0 0 76px}
.ac span{font-size:46px;font-weight:600;color:var(--ink)}
#fol{position:absolute;left:190px;right:190px;top:1400px;height:120px;border-radius:30px;overflow:hidden;font-size:48px;font-weight:700;
  animation:pop .6s ease 12.0s both, press .3s ease 13.15s}
@keyframes press{50%{transform:scale(.94)}}
#fol div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
#fol .f{background:var(--em);box-shadow:inset 0 0 0 4px var(--gold-l)}
#fol .d{background:#bfa58a;opacity:0;animation:fadeIn .25s ease 13.3s both}
#tapC{left:640px;top:1460px;animation:tap 1.3s ease 12.5s both}
#hand{position:absolute;top:1550px;left:0;right:0;text-align:center;font-size:40px;letter-spacing:3px;color:var(--gold-d);font-weight:700;animation:rise .6s ease 13.6s both}
</style></head>
<body><div id="stage">
  <div id="petals" class="abs"></div>
  <div id="tTR" class="tul"><img src="brand/tulips_tr.png"></div>
  <div id="tBL" class="tul"><img src="brand/tulips_bl.png"></div>
  <div id="logoTop" class="logo"><img src="brand/logo.png"><div class="shine"></div></div>

  <div id="A" class="part">
    <div class="q">Yangi kolleksiyani qanchalik kutyapsiz?</div>
    <div id="slider" class="card"><div class="lbl">Slayderni suring 👉</div>
      <div id="track"><div id="fill"></div><div id="knob" class="emoji">😍</div></div></div>
    <div id="tapA" class="tap"></div>
    <div id="flies"></div>
  </div>

  <div id="B" class="part"><div id="Bin" class="part">
    <div class="q">Sevimli rangingiz qaysi?</div>
    <div id="sw">
      <div class="s" style="--t:5.9s"><i style="background:radial-gradient(circle at 35% 30%,#ffd6e0,#f08aa6)"></i><b>Pushti</b></div>
      <div class="s" style="--t:6.2s"><i style="background:radial-gradient(circle at 35% 30%,#ffffff,#efe6da)"></i><b>Oq</b></div>
      <div class="s" style="--t:6.5s"><i style="background:radial-gradient(circle at 35% 30%,#3d9a66,#0b4a2a)"></i><b>Yashil</b></div>
      <div class="s" style="--t:6.8s"><i style="background:radial-gradient(circle at 35% 30%,#fbe7a8,#b98a30)"></i><b>Oltin</b></div>
    </div>
    <div id="cm">Izohda yozing <span class="emoji">👇</span></div>
  </div></div>

  <div id="C" class="part">
    <div class="q">Bizni qo’llab-quvvatlang!</div>
    <div id="acts">
      <div class="ac card" style="--t:10.3s"><svg viewBox="0 0 24 24"><path fill="#e0475c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><span>Layk bosing</span></div>
      <div class="ac card" style="--t:10.7s"><svg viewBox="0 0 24 24" fill="none" stroke="#0e5c34" stroke-width="2" stroke-linejoin="round"><path d="M20.5 11.5a8.5 8.5 0 1 1-4-7.2 8.5 8.5 0 0 1 4 7.2zM20.5 20.5l-2.3-4.6"/></svg><span>Izoh qoldiring</span></div>
      <div class="ac card" style="--t:11.1s"><svg viewBox="0 0 24 24" fill="none" stroke="#c99a3e" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-5-6 5z"/></svg><span>Saqlab qo’ying</span></div>
      <div class="ac card" style="--t:11.5s"><svg viewBox="0 0 24 24" fill="none" stroke="#0e5c34" stroke-width="2" stroke-linejoin="round"><path d="M22 3L2 10l8 3 3 8zM22 3L10 13"/></svg><span>Do’stingizga yuboring</span></div>
    </div>
    <div id="fol"><div class="f">Obuna bo’lish</div><div class="d">Obuna bo’lindi ✓</div></div>
    <div id="tapC" class="tap"></div>
    <div id="hand">@AZELLE_BOUTIQUE_</div>
  </div>
  <div id="vign"></div>
</div>
<script src="brand/brand.js"></script>
<script>
petals($('petals'), 20, 0.1);
const f = $('flies');
for (let i = 0; i < 12; i++) {
  const d = el('fly emoji', f, { left: (760 + rnd() * 180) + 'px', top: '1080px' },
    { '--x': (rnd() * 400 - 300) + 'px', '--r': (rnd() * 60 - 30) + 'deg', '--d': (1.4 + rnd()) + 's', '--dl': (3.7 + i * 0.08) + 's' });
  d.textContent = ['😍', '💖', '🌷', '✨'][i % 4];
}
</script></body></html>
